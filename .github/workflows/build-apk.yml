name: Build Auto-Updating Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Local Fallback Assets
        run: |
          mkdir -p www
          cp index.html www/
          cp -f data.json www/ 2>/dev/null || true
          cp -f sw.js www/ 2>/dev/null || true
          cp -f manifest.json www/ 2>/dev/null || true
          cp -f *.txt www/ 2>/dev/null || true

      - name: Initialize Capacitor and Generate Custom App Icon
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6
          npm install -D @capacitor/assets
          npx cap init "দ্বীনি মেহনত" "com.deenimehonot.app" --web-dir www
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.deenimehonot.app",
            "appName": "দ্বীনি মেহনত",
            "webDir": "www",
            "server": {
              "url": "https://fahimhasan68.github.io/my-audio-app/",
              "cleartext": true,
              "allowNavigation": ["*"]
            }
          }
          EOF
          
          npx cap add android
          
          # আপনার আপলোড করা icon.png থেকে সব সাইজের অ্যান্ড্রয়েড আইকন তৈরি
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            npx capacitor-assets generate --android --iconBackgroundColor '#164431' --splashBackgroundColor '#164431'
          fi

      - name: Configure Android Storage Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\n    <application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"|g' $MANIFEST

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deeni-Mehonot-AutoUpdate-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
