name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets for APK
        run: |
          mkdir -p www
          cp index.html www/
          cp -f data.json www/ 2>/dev/null || true
          cp -f sw.js www/ 2>/dev/null || true
          cp -f manifest.json www/ 2>/dev/null || true
          cp -f *.txt www/ 2>/dev/null || true

      - name: Initialize Capacitor and Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "দ্বীনি মেহনত" "com.deenimehonot.app" --web-dir www
          npx cap add android

      - name: Configure Android Permissions and UI
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application android:usesCleartextTraffic="true"|g' $MANIFEST

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Deeni-Mehonot-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
