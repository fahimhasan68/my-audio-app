<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>দ্বীনি মেহনত</title>
    <style>
        :root {
            --bg-deep: #071f18;
            --bg-card: #0d3327;
            --bg-surface: #134636;
            --gold-main: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #ecfdf5;
            --text-muted: #a7f3d0;
            --border-gold: rgba(212, 175, 55, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', 'Kalpurush', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* উপরের হেডার */
        header {
            background: linear-gradient(135deg, #0a2920 0%, #134636 100%);
            padding: 16px 20px;
            border-bottom: 2px solid var(--gold-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .app-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold-main);
            letter-spacing: 0.5px;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--gold-main);
            color: var(--gold-light);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .refresh-btn:active {
            background-color: var(--gold-main);
            color: var(--bg-deep);
        }

        /* মেইন কন্টেন্ট এরিয়া */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 90px;
        }

        .tab-section {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .tab-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* কার্ড ডিজাইন */
        .item-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .item-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--gold-light);
            line-height: 1.4;
        }

        .item-date {
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(19, 70, 54, 0.8);
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
            margin-left: 8px;
            border: 1px solid var(--border-gold);
        }

        .item-desc {
            font-size: 15px;
            color: var(--text-light);
            line-height: 1.6;
            margin-top: 8px;
            white-space: pre-line;
        }

        /* অডিও প্লেয়ার ও ডাউনলোড কন্ট্রোল */
        .audio-controls {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 8px;
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-gold {
            background: linear-gradient(135deg, #d4af37 0%, #b59024 100%);
            color: #071f18;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* নোটিশ ব্যাজ */
        .notice-badge {
            display: inline-block;
            background-color: rgba(212, 175, 55, 0.2);
            color: var(--gold-main);
            border: 1px solid var(--gold-main);
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        /* নিচের নেভিগেশন বার */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #051611;
            border-top: 1px solid var(--border-gold);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .nav-item.active {
            color: var(--gold-main);
            font-weight: bold;
            background-color: rgba(212, 175, 55, 0.12);
        }

        .nav-icon {
            font-size: 20px;
        }

        .status-box {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">দ্বীনি মেহনত</div>
        <button class="refresh-btn" onclick="fetchContent()">🔄 আপডেট</button>
    </header>

    <main>
        <!-- ১. অডিও সেকশন -->
        <section id="tab-audio" class="tab-section active">
            <div id="audio-list" class="status-box">ডাটা লোড হচ্ছে...</div>
        </section>

        <!-- ২. প্রবন্ধ সেকশন -->
        <section id="tab-articles" class="tab-section">
            <div id="article-list" class="status-box">ডাটা লোড হচ্ছে...</div>
        </section>

        <!-- ৩. নোটিশবোর্ড সেকশন -->
        <section id="tab-notices" class="tab-section">
            <div id="notice-list" class="status-box">ডাটা লোড হচ্ছে...</div>
        </section>
        <!-- ৪. উমরি কাজা সেকশন -->
<section id="tab-qaza" class="tab-section">
    <!-- কাস্টম ইনপুট সেটআপ বক্স -->
    <div class="item-card" style="border: 1px dashed var(--gold-main); background: rgba(13, 51, 39, 0.7); margin-bottom: 20px;">
        <div class="item-title" style="font-size: 16px; margin-bottom: 6px;">⚙️ ওয়াক্ত অনুযায়ী কাজা সংখ্যা নির্ধারণ করুন</div>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">
            যে ওয়াক্ত যত দিন কাজা হয়েছে তা সংশ্লিষ্ট ঘরে লিখুন। এরপর "সংরক্ষণ করুন" বাটনে চাপ দিন।
        </p>
        
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px;">
            <div>
                <label style="font-size: 12px; color: var(--gold-light);">ফজর (ওয়াক্ত):</label>
                <input type="number" id="input_fajr" placeholder="০" min="0"
                       style="width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border-gold); background: #071f18; color: #fff; outline: none;">
            </div>
            <div>
                <label style="font-size: 12px; color: var(--gold-light);">যোহর (ওয়াক্ত):</label>
                <input type="number" id="input_dhuhr" placeholder="০" min="0"
                       style="width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border-gold); background: #071f18; color: #fff; outline: none;">
            </div>
            <div>
                <label style="font-size: 12px; color: var(--gold-light);">আসর (ওয়াক্ত):</label>
                <input type="number" id="input_asr" placeholder="০" min="0"
                       style="width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border-gold); background: #071f18; color: #fff; outline: none;">
            </div>
            <div>
                <label style="font-size: 12px; color: var(--gold-light);">মাগরিব (ওয়াক্ত):</label>
                <input type="number" id="input_maghrib" placeholder="০" min="0"
                       style="width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border-gold); background: #071f18; color: #fff; outline: none;">
            </div>
            <div>
                <label style="font-size: 12px; color: var(--gold-light);">এশা (ওয়াক্ত):</label>
                <input type="number" id="input_isha" placeholder="০" min="0"
                       style="width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border-gold); background: #071f18; color: #fff; outline: none;">
            </div>
            <div>
                <label style="font-size: 12px; color: var(--gold-light);">বিতর (ওয়াক্ত):</label>
                <input type="number" id="input_witr" placeholder="০" min="0"
                       style="width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border-gold); background: #071f18; color: #fff; outline: none;">
            </div>
        </div>

        <button class="btn-gold" onclick="saveCustomQaza()" style="width: 100%; justify-content: center; padding: 10px;">
            💾 নতুন হিসাব সংরক্ষণ করুন
        </button>
    </div>

    <!-- সর্বমোট অবশিষ্ট হিসাব কার্ড -->
    <div id="qaza-summary" class="item-card" style="text-align: center; border-color: var(--gold-main); padding: 12px; margin-bottom: 15px;">
        <span style="font-size: 13px; color: var(--text-muted);">সর্বমোট অবশিষ্ট কাজা: </span>
        <span id="total-qaza-count" style="font-size: 20px; font-weight: bold; color: var(--gold-main);">০</span>
        <span style="font-size: 13px; color: var(--text-muted);"> ওয়াক্ত</span>
    </div>

    <!-- ৬ ওয়াক্তের ট্র্যাকিং কার্ড গ্রিড -->
    <div id="qaza-grid" style="display: flex; flex-direction: column; gap: 12px;"></div>
</section>
    </main>

    <!-- নিচের মেনু বার -->
    <nav>
        <button class="nav-item active" onclick="switchTab('audio', this)">
            <span class="nav-icon">🎧</span>
            <span>অডিও (.opus)</span>
        </button>
        <button class="nav-item" onclick="switchTab('articles', this)">
            <span class="nav-icon">📖</span>
            <span>প্রবন্ধ</span>
        </button>
        <button class="nav-item" onclick="switchTab('notices', this)">
            <span class="nav-icon">📌</span>
            <span>নোটিশবোর্ড</span>
        </button>
        <!-- নতুন উমরি কাজা বাটন -->
    <button class="nav-item" onclick="switchTab('qaza', this)">
        <span class="nav-icon">📿</span>
        <span>উমরি কাজা</span>
    </button>
    </nav>

    <script>
        // আপনার GitHub বা সার্ভারের data.json ফাইলের Raw লিংক এখানে বসাবেন
        const DATA_URL = "data.json";

        function switchTab(tabName, btnElement) {
            document.querySelectorAll('.tab-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));

            document.getElementById('tab-' + tabName).classList.add('active');
            btnElement.classList.add('active');
        }

        async function fetchContent() {
            try {
                // ক্যাশ এড়াতে টাইমস্ট্যাম্প যুক্ত করা হয়েছে যাতে আপলোডের সাথে সাথেই নতুন ডাটা আসে
                const response = await fetch(DATA_URL + '?t=' + new Date().getTime());
                const data = await response.json();
                renderAudios(data.audios || []);
                renderArticles(data.articles || []);
                renderNotices(data.notices || []);
            } catch (error) {
                // অফলাইনে বা প্রথমবার টেস্ট করার জন্য ডেমো ডাটা
                const demoData = {
                    audios: [
                        {
                            title: "দারসুল কুরআন ও বিশেষ আলোচনা - পর্ব ১",
                            date: "২ নভেম্বর ২০২৬",
                            note: "অডিওটি শুনতে প্লে বাটনে চাপুন অথবা ডাউনলোড করে অফলাইনে শুনুন।",
                            url: "sample.opus"
                        }
                    ],
                    articles: [
                        {
                            title: "সময়ের মূল্য ও আত্মশুদ্ধি",
                            date: "২ নভেম্বর ২০২৬",
                            content: "মানুষের জীবনের প্রতিটি মুহূর্ত অত্যন্ত মূল্যবান। আমাদের উচিত প্রতিদিন অন্তত কিছু সময় জ্ঞানার্জন ও আত্মসমালোচনায় ব্যয় করা।\n\nএখানে আপনি যত বড় ইচ্ছা প্রবন্ধ লিখতে পারবেন, প্যারাগ্রাফ আকারে সুন্দরভাবে দেখা যাবে।"
                        }
                    ],
                    notices: [
                        {
                            title: "আগামী শুক্রবারের বিশেষ সেশন প্রসঙ্গে",
                            date: "২ নভেম্বর ২০২৬",
                            priority: "জরুরি নোটিশ",
                            content: "আগামী শুক্রবার বাদ মাগরিব নতুন অডিও লেকচার আপলোড করা হবে ইনশাআল্লাহ।"
                        }
                    ]
                };
                renderAudios(demoData.audios);
                renderArticles(demoData.articles);
                renderNotices(demoData.notices);
            }
        }

        function renderAudios(audios) {
            const container = document.getElementById('audio-list');
            if (audios.length === 0) {
                container.innerHTML = '<div class="status-box">কোনো অডিও ফাইল পাওয়া যায়নি।</div>';
                return;
            }
            container.innerHTML = audios.map(item => `
                <div class="item-card">
                    <div class="card-header">
                        <div class="item-title">🎙️ ${item.title}</div>
                        <div class="item-date">${item.date}</div>
                    </div>
                    ${item.note ? `<div class="item-desc">${item.note}</div>` : ''}
                    <div class="audio-controls">
                        <audio controls preload="none">
                            <source src="${item.url}" type="audio/ogg; codecs=opus">
                            <source src="${item.url}" type="audio/opus">
                            আপনার ডিভাইসটি এই অডিও সাপোর্ট করছে না।
                        </audio>
                        <div class="action-row">
                            <a href="${item.url}" download class="btn-gold">⬇️ ডাউনলোড (.opus)</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function renderArticles(articles) {
            const container = document.getElementById('article-list');
            if (!container) return;

            if (!articles || articles.length === 0) {
                container.innerHTML = '<div class="status-box">কোনো প্রবন্ধ পাওয়া যায়নি।</div>';
                return;
            }

            container.innerHTML = '<div class="status-box">প্রবন্ধ লোড হচ্ছে...</div>';

            let html = '';
            for (const item of articles) {
                let textContent = item.content || '';

                // যদি আলাদা .txt ফাইল বা এক্সটার্নাল লিংক থাকে
                if (item.file) {
                    try {
                        const response = await fetch(item.file + '?t=' + new Date().getTime());
                        if (response.ok) {
                            textContent = await response.text();
                        } else {
                            textContent = 'দুঃখিত, টেক্সট ফাইলটি লোড করা যায়নি (ফাইল লিংক চেক করুন)।';
                        }
                    } catch (err) {
                        textContent = 'ফাইলটি পড়তে সমস্যা হচ্ছে। ইন্টারনেট সংযোগ পরীক্ষা করুন।';
                    }
                }

                html += `
                    <div class="item-card">
                        <div class="card-header">
                            <div class="item-title">📜 ${item.title || 'শিরোনামহীন'}</div>
                            <div class="item-date">${item.date || ''}</div>
                        </div>
                        <div class="item-desc" style="white-space: pre-wrap; font-size: 16px; line-height: 1.8; color: var(--text-light);text-align: justify">${textContent}</div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function renderNotices(notices) {
            const container = document.getElementById('notice-list');
            if (notices.length === 0) {
                container.innerHTML = '<div class="status-box">বর্তমানে কোনো নতুন নোটিশ নেই।</div>';
                return;
            }
            container.innerHTML = notices.map(item => `
                <div class="item-card">
                    <span class="notice-badge">🔔 ${item.priority || 'সাধারণ নোটিশ'}</span>
                    <div class="card-header">
                        <div class="item-title">${item.title}</div>
                        <div class="item-date">${item.date}</div>
                    </div>
                    <div class="item-desc">${item.content}</div>
                </div>
            `).join('');
        }

        // অ্যাপ চালু হলেই ডাটা লোড করবে
        fetchContent();
        // উমরি কাজা ট্র্যাকিং লজিক (সম্পূর্ণ লোকাল ডাটা)
// উমরি কাজা ট্র্যাকিং লজিক (সম্পূর্ণ লোকাল ডাটা)
const WAQTS = [
    { id: 'fajr', name: 'ফজর' },
    { id: 'dhuhr', name: 'যোহর' },
    { id: 'asr', name: 'আসর' },
    { id: 'maghrib', name: 'মাগরিব' },
    { id: 'isha', name: 'এশা' },
    { id: 'witr', name: 'বিতর' }
];

// ইউজারের ডিভাইসের লোকাল মেমোরি থেকে ডাটা আনা
function loadQazaData() {
    const saved = localStorage.getItem('user_umri_qaza_data');
    if (saved) {
        return JSON.parse(saved);
    }
    return { fajr: 0, dhuhr: 0, asr: 0, maghrib: 0, isha: 0, witr: 0 };
}

function saveQazaData(data) {
    localStorage.setItem('user_umri_qaza_data', JSON.stringify(data));
    renderQazaCards();
}

// প্রতি ওয়াক্তের আলাদা ইনপুট সেভ করা
function saveCustomQaza() {
    const currentData = loadQazaData();
    const updatedData = {};

    WAQTS.forEach(w => {
        const inputVal = document.getElementById('input_' + w.id).value.trim();
        if (inputVal !== "") {
            const parsed = parseInt(inputVal);
            updatedData[w.id] = (isNaN(parsed) || parsed < 0) ? 0 : parsed;
        } else {
            updatedData[w.id] = currentData[w.id] || 0;
        }
    });

    if (confirm("আপনি কি নিশ্চিতভাবে এই নতুন কাজা সংখ্যা সেট করতে চান?")) {
        saveQazaData(updatedData);
        // ইনপুট বক্সগুলো রিসেট করা
        WAQTS.forEach(w => {
            document.getElementById('input_' + w.id).value = '';
        });
        alert("কাজা নামাজের হিসাব সফলভাবে সেভ হয়েছে!");
    }
}

// এক ওয়াক্ত করে মাইনাস করার ফাংশন (-১)
function decrementWaqt(waqtId) {
    const data = loadQazaData();
    if (data[waqtId] > 0) {
        data[waqtId] -= 1;
        saveQazaData(data);
    } else {
        alert("আলহামদুলিল্লাহ! এই ওয়াক্তের আর কোনো কাজা বাকি নেই।");
    }
}

// ভুলবশত মাইনাস হলে প্লাস করার ফাংশন (+১)
function incrementWaqt(waqtId) {
    const data = loadQazaData();
    data[waqtId] = (data[waqtId] || 0) + 1;
    saveQazaData(data);
}

// সরাসরি কোনো নির্দিষ্ট ওয়াক্তের সংখ্যা এডিট করার সুবিধা
function editWaqtDirectly(waqtId, waqtName) {
    const data = loadQazaData();
    const currentVal = data[waqtId] || 0;
    const newVal = prompt(`${waqtName} ওয়াক্তের বর্তমান কাজা সংখ্যা লিখুন:`, currentVal);
    
    if (newVal !== null) {
        const parsed = parseInt(newVal.trim());
        if (!isNaN(parsed) && parsed >= 0) {
            data[waqtId] = parsed;
            saveQazaData(data);
        } else {
            alert("দয়া করে সঠিক সংখ্যা লিখুন!");
        }
    }
}

// UI রেন্ডার করা
function renderQazaCards() {
    const container = document.getElementById('qaza-grid');
    const totalEl = document.getElementById('total-qaza-count');
    if (!container) return;

    const data = loadQazaData();
    let totalCount = 0;

    container.innerHTML = WAQTS.map(w => {
        const count = data[w.id] || 0;
        totalCount += count;
        
        return `
            <div class="item-card" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; margin-bottom: 0;">
                <div>
                    <div style="font-size: 17px; font-weight: bold; color: var(--gold-light); display: flex; align-items: center; gap: 8px;">
                        <span>${w.name}</span>
                        <button onclick="editWaqtDirectly('${w.id}', '${w.name}')" title="সরাসরি এডিট করুন" 
                                style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px;">
                            ✏️
                        </button>
                    </div>
                    <div style="font-size: 13px; color: var(--text-muted); margin-top: 3px;">
                        বাকি: <span style="font-size: 16px; font-weight: bold; color: ${count === 0 ? '#10b981' : 'var(--gold-main)'};">${count}</span> ওয়াক্ত
                    </div>
                </div>
                
                <div style="display: flex; align-items: center; gap: 8px;">
                    <button onclick="incrementWaqt('${w.id}')" title="১ ওয়াক্ত যোগ করুন" 
                            style="background: transparent; border: 1px solid var(--border-gold); color: var(--text-light); width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 16px;">
                        +
                    </button>
                    <button class="btn-gold" onclick="decrementWaqt('${w.id}')" 
                            style="padding: 8px 12px; font-size: 13px; display: flex; align-items: center; gap: 4px;">
                        <span>✔ আদায় (-১)</span>
                    </button>
                </div>
            </div>
        `;
    }).join('');

    if (totalEl) {
        totalEl.innerText = totalCount;
    }
}

// পেজ ওপেন হলে স্বয়ংক্রিয়ভাবে কার্ডগুলো লোড হবে
renderQazaCards();
    </script>
</body>
</html>
