<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>দ্বীনি মেহনত</title>
    <meta name="theme-color" content="#164431">
    <style>
        :root {
            --green-primary: #164431;      /* কিতাবের প্রচ্ছদের গাঢ় সবুজ */
            --green-dark: #0f3022;         /* গভীর সবুজ */
            --green-soft: #e7efe9;         /* হালকা সবুজ হাইলাইট */
            --cream-bg: #f6f5ee;           /* প্রচ্ছদের উপরের অফ-হোয়াইট/ক্রিম শেড */
            --card-white: #ffffff;         /* পরিষ্কার সাদা কার্ড */
            --gold-main: #d4af37;          /* সোনালী বর্ডার ও অ্যাকসেন্ট */
            --gold-text: #f0d77b;          /* গাঢ় ব্যাকগ্রাউন্ডে সোনালী লেখা */
            --text-dark: #163024;          /* আরামদায়ক গাঢ় টেক্সট */
            --text-muted: #526b5e;         /* তারিখ ও সাব-টেক্সট */
            --border-subtle: #d5dfd9;      /* হালকা বর্ডার */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', 'Kalpurush', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--cream-bg);
            background-image: radial-gradient(rgba(22, 68, 49, 0.06) 1px, transparent 1px);
            background-size: 16px 16px;
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            overscroll-behavior-y: contain;
        }

        header {
            background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-primary) 100%);
            padding: 14px 18px;
            border-bottom: 3px solid var(--gold-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
            flex-shrink: 0;
        }

        .app-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold-text);
            letter-spacing: 0.5px;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--gold-main);
            color: var(--gold-text);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .refresh-btn:active {
            background-color: var(--gold-main);
            color: var(--green-dark);
        }

        main {
            flex: 1;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            padding: 12px;
            padding-bottom: 90px;
            width: 100%;
        }

        .tab-section {
            display: none;
            width: 100%;
            animation: fadeIn 0.2s ease;
        }

        .tab-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item-card {
            background-color: var(--card-white);
            border: 1px solid var(--border-subtle);
            border-left: 4px solid var(--green-primary);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(22, 68, 49, 0.06);
            width: 100%;
            text-align: left;
        }

        .item-title {
            font-size: 17px;
            font-weight: bold;
            color: var(--green-primary);
            line-height: 1.5;
            width: 100%;
            text-align: left;
            word-break: break-word;
        }

        .item-date {
            font-size: 12px;
            color: var(--text-muted);
            display: inline-block;
            margin-top: 5px;
        }

        .item-desc {
            font-size: 15px;
            color: var(--text-dark);
            line-height: 1.75;
            margin-top: 10px;
            white-space: pre-line;
            border-top: 1px dashed var(--border-subtle);
            padding-top: 10px;
            text-align: left;
        }

        .font-control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-white);
            border: 1px solid var(--gold-main);
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            width: 100%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .font-btn {
            background: var(--green-soft);
            border: 1px solid var(--green-primary);
            color: var(--green-primary);
            font-size: 13px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .font-btn:active {
            background-color: var(--green-primary);
            color: #ffffff;
        }

        .audio-controls {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 8px;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--green-primary) 0%, var(--green-dark) 100%);
            color: var(--gold-text);
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--gold-main);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 5px rgba(22, 68, 49, 0.15);
        }

        .btn-gold:disabled {
            opacity: 0.85;
            cursor: wait;
        }

        .notice-badge {
            display: inline-block;
            background-color: var(--green-soft);
            color: var(--green-primary);
            border: 1px solid var(--green-primary);
            font-size: 12px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 9px 10px;
            margin-top: 4px;
            border-radius: 6px;
            border: 1px solid var(--border-subtle);
            background: #fafaf7;
            color: var(--text-dark);
            outline: none;
            font-size: 14px;
        }

        .form-input:focus {
            border-color: var(--green-primary);
            background: #ffffff;
        }

        /* নামাজের সময়সূচির সারি */
        .prayer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 15px;
        }

        .prayer-row:last-child {
            border-bottom: none;
        }

        .prayer-name {
            font-weight: bold;
            color: var(--green-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prayer-time {
            font-weight: bold;
            color: var(--text-dark);
            background: var(--green-soft);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(22, 68, 49, 0.15);
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--green-dark);
            border-top: 2px solid var(--gold-main);
            display: flex;
            justify-content: space-around;
            padding: 6px 2px;
            z-index: 100;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: #b7cfc3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 11px;
            cursor: pointer;
            padding: 6px 4px;
            border-radius: 8px;
            transition: 0.2s;
            flex: 1;
        }

        .nav-item.active {
            color: var(--gold-text);
            font-weight: bold;
            background-color: rgba(212, 175, 55, 0.18);
        }

        .nav-icon {
            font-size: 18px;
        }

        .status-box {
            text-align: center;
            padding: 30px 15px;
            color: var(--text-muted);
            width: 100%;
            line-height: 1.6;
        }

        /* আরবি লেখার ফন্ট এবং স্বাভাবিক ফাঁকা জায়গা ঠিক করার জন্য */
        .article-content-body .ar-box {
            font-family: 'Noorehuda', 'Al Qalam Quran Majeed', 'PDMS Saleem QuranFont', 'Amiri', serif !important;
            font-size: 1.55em !important;
            line-height: 1.85 !important;
            text-align: right;
            color: var(--green-dark);
            margin: -14px 0 !important;
        }

        /* হাদিস নম্বর (الحديث - ١) এর জন্য */
        .article-content-body .hadith-num {
            font-family: 'Noorehuda', 'Al Qalam Quran Majeed', 'Amiri', serif !important;
            font-size: 1.15em !important;
            font-weight: bold;
            color: #9c7813;
            text-align: right;
            margin: -10px 0 -16px 0 !important;
        }

        /* কিতাবের রেফারেন্স (صحيح البخاري) ছোট ও সুন্দর দেখানোর জন্য */
        .article-content-body .ref-box {
            font-family: 'Noorehuda', 'Al Qalam Quran Majeed', 'Amiri', serif !important;
            font-size: 0.92em !important;
            color: var(--text-muted);
            text-align: left;
            margin: -16px 0 -8px 0 !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="app-title">দ্বীনি মেহনত</div>
        <button type="button" class="refresh-btn" onclick="manualRefresh()">🔄 আপডেট</button>
    </header>

    <main>
        <!-- ১. অডিও সেকশন -->
        <section id="tab-audio" class="tab-section active">
            <div id="audio-list" class="status-box">
                অডিও তালিকা দেখতে নিচের বাটনে চাপ দিন।<br>
                <button type="button" class="btn-gold" style="margin-top: 15px;" onclick="fetchAudiosFromArchive()">🎧 অডিও লোড করুন</button>
            </div>
        </section>

        <!-- ২. প্রবন্ধ সেকশন -->
        <section id="tab-articles" class="tab-section">
            <div class="font-control-bar">
                <span style="font-size: 13px; color: var(--green-primary); font-weight: bold;">🔍 লেখার আকার: <b id="font-size-display">16px</b></span>
                <div style="display: flex; gap: 6px;">
                    <button type="button" class="font-btn" onclick="changeArticleFontSize(-1)">A-</button>
                    <button type="button" class="font-btn" onclick="resetArticleFontSize()">ডিফল্ট</button>
                    <button type="button" class="font-btn" onclick="changeArticleFontSize(1)">A+</button>
                </div>
            </div>
            <div id="article-list" class="status-box">ডাটা লোড হচ্ছে...</div>
        </section>

        <!-- ৩. নামাজের সময়সূচি সেকশন -->
        <section id="tab-prayer" class="tab-section">
            <div class="item-card" style="border-top: 3px solid var(--gold-main);">
                <div class="item-title" style="font-size: 16px; margin-bottom: 6px;">🕌 জেলাভিত্তিক নামাজের সময়সূচি</div>
                <label for="district-select" style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">
                    আপনার জেলা নির্বাচন করুন (হানাফি মাজহাব অনুযায়ী):
                </label>
                <select id="district-select" class="form-input" onchange="onDistrictChange()" style="font-weight: bold; color: var(--green-primary);"></select>
                <div id="prayer-date-info" style="font-size: 12px; color: var(--text-muted); margin-top: 8px;"></div>
            </div>

            <div id="prayer-times-container" class="item-card" style="padding: 0; overflow: hidden;">
                <div class="status-box">সময়সূচি লোড হচ্ছে...</div>
            </div>
        </section>

        <!-- ৪. নোটিশবোর্ড সেকশন -->
        <section id="tab-notices" class="tab-section">
            <div id="notice-list" class="status-box">ডাটা লোড হচ্ছে...</div>
        </section>

        <!-- ৫. উমরি কাজা সেকশন -->
        <section id="tab-qaza" class="tab-section">
            <div class="item-card" style="border-top: 3px solid var(--gold-main); margin-bottom: 14px;">
                <div class="item-title" style="font-size: 16px; margin-bottom: 4px;">⚙️ ওয়াক্ত অনুযায়ী কাজা নির্ধারণ</div>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
                    যে ওয়াক্ত যত দিন কাজা হয়েছে লিখে সংরক্ষণ করুন।
                </p>
                
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px;">
                    <div>
                        <label style="font-size: 12px; color: var(--green-primary); font-weight: bold;">ফজর:</label>
                        <input type="number" id="input_fajr" placeholder="০" min="0" class="form-input">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--green-primary); font-weight: bold;">যোহর:</label>
                        <input type="number" id="input_dhuhr" placeholder="০" min="0" class="form-input">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--green-primary); font-weight: bold;">আসর:</label>
                        <input type="number" id="input_asr" placeholder="০" min="0" class="form-input">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--green-primary); font-weight: bold;">মাগরিব:</label>
                        <input type="number" id="input_maghrib" placeholder="০" min="0" class="form-input">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--green-primary); font-weight: bold;">এশা:</label>
                        <input type="number" id="input_isha" placeholder="০" min="0" class="form-input">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--green-primary); font-weight: bold;">বিতর:</label>
                        <input type="number" id="input_witr" placeholder="০" min="0" class="form-input">
                    </div>
                </div>

                <button type="button" class="btn-gold" onclick="saveCustomQaza()" style="width: 100%; justify-content: center; padding: 10px;">
                    💾 নতুন হিসাব সংরক্ষণ করুন
                </button>
            </div>

            <div id="qaza-summary" class="item-card" style="text-align: center; background-color: var(--green-soft); border-color: var(--green-primary); padding: 10px; margin-bottom: 12px;">
                <span style="font-size: 13px; color: var(--text-dark); font-weight: bold;">সর্বমোট অবশিষ্ট কাজা: </span>
                <span id="total-qaza-count" style="font-size: 20px; font-weight: bold; color: var(--green-primary);">০</span>
                <span style="font-size: 13px; color: var(--text-dark); font-weight: bold;"> ওয়াক্ত</span>
            </div>

            <div id="qaza-grid" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </section>
    </main>

    <nav>
        <button type="button" class="nav-item active" data-tab="audio" onclick="switchTab('audio', this)">
            <span class="nav-icon">🎧</span>
            <span>অডিও</span>
        </button>
        <button type="button" class="nav-item" data-tab="articles" onclick="switchTab('articles', this)">
            <span class="nav-icon">📖</span>
            <span>প্রবন্ধ</span>
        </button>
        <button type="button" class="nav-item" data-tab="prayer" onclick="switchTab('prayer', this)">
            <span class="nav-icon">🕌</span>
            <span>নামাজ</span>
        </button>
        <button type="button" class="nav-item" data-tab="notices" onclick="switchTab('notices', this)">
            <span class="nav-icon">📌</span>
            <span>নোটিশ</span>
        </button>
        <button type="button" class="nav-item" data-tab="qaza" onclick="switchTab('qaza', this)">
            <span class="nav-icon">📿</span>
            <span>উমরি কাজা</span>
        </button>
    </nav>

        }

        // ১. ইন্টারনেট আর্কাইভ থেকে অডিও লোড
        async function fetchAudiosFromArchive() {
            const container = document.getElementById('audio-list');
            if (!container) return;

            if (!navigator.onLine) {
                container.className = 'status-box';
                container.innerHTML = `
                    📡 আপনি অফলাইনে আছেন। অডিও শুনতে ইন্টারনেট সংযোগ চালু করুন।
                `;
                return;
            }

            container.className = 'status-box';
            container.innerHTML = 'অডিও লোড হচ্ছে...';

            const primaryUrl = `https://archive.org/metadata/${ARCHIVE_IDENTIFIER}/files`;
            const fallbackUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(primaryUrl)}`;

            let data = null;
            try {
                const response = await fetchWithTimeout(primaryUrl, 4500);
                if (response.ok) data = await response.json();
            } catch (err) {}

            if (!data || !data.result) {
                try {
                    const fallbackResponse = await fetchWithTimeout(fallbackUrl, 5500);
                    if (fallbackResponse.ok) data = await fallbackResponse.json();
                } catch (fallbackErr) {}
            }

            if (!data || !data.result) {
                container.className = 'status-box';
                container.innerHTML = `
                    অডিও লোড করতে সমস্যা হয়েছে।<br>
                    <button type="button" class="btn-gold" style="margin-top: 15px;" onclick="fetchAudiosFromArchive()">🔄 আবার চেষ্টা করুন</button>
                `;
                return;
            }

            const audioFiles = data.result.filter(file => 
                file.name && file.name.toLowerCase().endsWith('.opus')
            );

            if (audioFiles.length === 0) {
                container.className = 'status-box';
                container.innerHTML = 'কোনো অডিও ফাইল পাওয়া যায়নি।';
                return;
            }

            container.className = '';
            container.innerHTML = audioFiles.map(file => {
                const fileUrl = `https://archive.org/download/${ARCHIVE_IDENTIFIER}/${encodeURIComponent(file.name)}`;
                const displayTitle = file.name.replace(/\.opus$/i, '');

                return `
                    <div class="item-card">
                        <div class="item-title">🎙️ ${displayTitle}</div>
                        <div class="audio-controls">
                            <audio controls preload="none">
                                <source src="${fileUrl}" type="audio/ogg; codecs=opus">
                                <source src="${fileUrl}" type="audio/opus">
                                আপনার ডিভাইসটি এই অডিও সাপোর্ট করছে না।
                            </audio>
                            <div style="display: flex; justify-content: flex-end;">
                                <button type="button" class="btn-gold" onclick="downloadAudioFile('${fileUrl}', '${file.name}', this)">⬇️ ডাউনলোড</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            isAudioLoaded = true;
        }

        // ২. লাইভ শতাংশ প্রগ্রেস দেখিয়ে ফোনের Downloads ডিরেক্টরিতে সেভ করার ফাংশন
        async function downloadAudioFile(url, fileName, btnElement) {
            if (!navigator.onLine) {
                alert("অডিও ডাউনলোড করার জন্য ইন্টারনেট সংযোগ চালু করুন!");
                return;
            }

            if (btnElement.disabled) return;
            const originalText = btnElement.innerHTML;
            btnElement.disabled = true;
            btnElement.innerHTML = "⏳ সংযোগ হচ্ছে...";

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Network error");

                const contentLength = response.headers.get('content-length');
                const total = contentLength ? parseInt(contentLength, 10) : 0;
                let loaded = 0;

                const reader = response.body.getReader();
                const chunks = [];

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loaded += value.length;

                    if (total > 0) {
                        const percent = Math.round((loaded / total) * 100);
                        btnElement.innerHTML = `⏳ ডাউনলোড হচ্ছে... ${percent}%`;
                    } else {
                        const mb = (loaded / (1024 * 1024)).toFixed(1);
                        btnElement.innerHTML = `⏳ ডাউনলোড হচ্ছে... ${mb} MB`;
                    }
                }

                // ফাইলটি তৈরি করে ফোনের Downloads ফোল্ডারে সেভ করা
                const blob = new Blob(chunks, { type: 'audio/ogg' });
                const blobUrl = URL.createObjectURL(blob);

                const tempLink = document.createElement('a');
                tempLink.href = blobUrl;
                tempLink.download = fileName;
                document.body.appendChild(tempLink);
                tempLink.click();
                document.body.removeChild(tempLink);

                setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);

                btnElement.innerHTML = "✅ সেভ সম্পন্ন (Downloads)";
                setTimeout(() => {
                    btnElement.innerHTML = originalText;
                    btnElement.disabled = false;
                }, 4500);

            } catch (error) {
                // কোনো ফোনের WebView যদি সরাসরি Blob সেভ ব্লক করে, তবে নেটিভ ডাউনলোড ম্যানেজার ওপেন করবে
                btnElement.innerHTML = "↗️ ডাউনলোড শুরু হচ্ছে...";
                window.open(url, '_system') || window.open(url, '_blank');
                
                setTimeout(() => {
                    btnElement.innerHTML = originalText;
                    btnElement.disabled = false;
                }, 3000);
            }
        }

        function formatTo12HourBn(time24) {
            if (!time24) return '--:--';
            const cleanTime = time24.split(' ')[0];
            let [hours, minutes] = cleanTime.split(':').map(Number);
            const period = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            const formattedStr = `${hours < 10 ? '0' + hours : hours}:${minutes < 10 ? '0' + minutes : minutes} ${period}`;
            
            // ইংরেজি সংখ্যাকে বাংলায় রূপান্তর
            const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return formattedStr.replace(/\d/g, d => bnDigits[d]);
        }

        async function loadPrayerTimes() {
            const container = document.getElementById('prayer-times-container');
            const dateInfoEl = document.getElementById('prayer-date-info');
            const city = localStorage.getItem('user_selected_district') || 'Khulna';
            const cacheKey = 'prayer_cache_' + city;

            // পূর্বে সেভ করা ডাটা থাকলে সাথে সাথে দেখাবে
            const cached = localStorage.getItem(cacheKey);
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    renderPrayerUI(parsed.timings, parsed.dateReadable);
                } catch(e) {}
            } else {
                container.innerHTML = '<div class="status-box">নামাজের সময়সূচি লোড হচ্ছে...</div>';
            }

            if (navigator.onLine) {
                try {
                    const apiUrl = `https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(city)}&country=Bangladesh&method=1&school=1`;
                    const response = await fetchWithTimeout(apiUrl, 4500);

                        if (json && json.data && json.data.timings) {

                            localStorage.setItem(cacheKey, JSON.stringify({ timings, dateReadable }));

                    if (!cached) {

                    renderArticles(parsed.articles || []);
                    renderNotices(parsed.notices || []);
                    hasCache = true;

            }

            if (navigator.onLine) {
                try {
                    const response = await fetchWithTimeout(DATA_URL, 3500);
                    if (response.ok) {
                        const data = await response.json();
                        localStorage.setItem('user_cached_site_data', JSON.stringify(data));
                        renderArticles(data.articles || []);
                        renderNotices(data.notices || []);
                    }
                } catch (error) {
                    if (!hasCache) {
                        renderArticles([]);
                        renderNotices([]);
                    }
                }
            } else if (!hasCache) {
                renderArticles([]);
                renderNotices([]);
            }
        }

                data[waqtId] -= 1;
                saveQazaData(data);

                alert("আলহামদুলিল্লাহ! এই ওয়াক্তের কাজা বাকি নেই।");

            loadPrayerTimes();
            if (currentActiveTab === 'audio' && navigator.onLine) {
                isAudioLoaded = false;
                fetchAudiosFromArchive();
            }
        }

        // ইনিশিয়ালাইজেশন
        initDistrictDropdown();
        switchTab(currentActiveTab);
        fetchContent();
        renderQazaCards();
        loadPrayerTimes();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                if (navigator.onLine) {
                    navigator.serviceWorker.register('./sw.js').catch(() => {});
                }
            });
        }
    </script>
</body>
</html>
