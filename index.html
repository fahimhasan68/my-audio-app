<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>দ্বীনি মেহনত</title>
    <style>
        :root {
            --bg-deep: #071f18;
            --bg-card: #0d3327;
            --bg-surface: #134636;
            --gold-main: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #ecfdf5;
            --text-muted: #a7f3d0;
            --border-gold: rgba(212, 175, 55, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', 'Kalpurush', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* উপরের হেডার */
        header {
            background: linear-gradient(135deg, #0a2920 0%, #134636 100%);
            padding: 16px 20px;
            border-bottom: 2px solid var(--gold-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .app-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold-main);
            letter-spacing: 0.5px;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--gold-main);
            color: var(--gold-light);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .refresh-btn:active {
            background-color: var(--gold-main);
            color: var(--bg-deep);
        }

        /* মেইন কন্টেন্ট এরিয়া */
        main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 90px;
        }

        .tab-section {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .tab-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* কার্ড ডিজাইন */
        .item-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .item-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--gold-light);
            line-height: 1.4;
        }
