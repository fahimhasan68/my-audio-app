<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>দ্বীনি মেহনত</title>
    <style>
        :root {
            --bg-deep: #071f18;
            --bg-card: #0d3327;
            --bg-surface: #134636;
            --gold-main: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #ecfdf5;
            --text-muted: #a7f3d0;
            --border-gold: rgba(212, 175, 55, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', 'Kalpurush', 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            overflow: hidden;
            overscroll-behavior-y: contain;
        }

        header {
            background: linear-gradient(135deg, #0a2920 0%, #134636 100%);
            padding: 14px 18px;
            border-bottom: 2px solid var(--gold-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }

        .app-title {
            font-size: 20px;
            font-weight: bold;
            color: var(--gold-main);
            letter-spacing: 0.5px;
        }

        .refresh-btn {
            background: transparent;
            border: 1px solid var(--gold-main);
            color: var(--gold-light);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }

        .refresh-btn:active {
            background-color: var(--gold-main);
            color: var(--bg-deep);
        }

        main {
            flex: 1;
            overflow-y: auto;
            overscroll-behavior-y: contain;
            padding: 12px;
            padding-bottom: 90px;
            width: 100%;
        }

        .tab-section {
            display: none;
            width: 100%;
            animation: fadeIn 0.2s ease;
        }

        .tab-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-gold);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.25);
            width: 100%;
            text-align: left;
        }

        .item-title {
            font-size: 17px;
            font-weight: bold;
            color: var(--gold-light);
            line-height: 1.5;
            width: 100%;
            text-align: left;
            word-break: break-word;
        }

        .item-date {
            font-size: 12px;
            color: var(--text-muted);
            display: inline-block;
            margin-top: 6px;
        }

        .item-desc {
            font-size: 15px;
            color: var(--text-light);
            line-height: 1.7;
            margin-top: 10px;
            white-space: pre-line;
            border-top: 1px dashed var(--border-gold);
            padding-top: 10px;
            text-align: left;
        }

        .font-control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(13, 51, 39, 0.7);
            border: 1px solid var(--border-gold);
            padding: 8px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            width: 100%;
        }

        .font-btn {
            background: transparent;
            border: 1px solid var(--border-gold);
            color: var(--gold-light);
            font-size: 13px;
            font-weight: bold;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .font-btn:active {
            background-color: var(--gold-main);
            color: var(--bg-deep);
        }

        .audio-controls {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        audio {
            width: 100%;
            height: 40px;
            border-radius: 8px;
        }

        .btn-gold {
            background: linear-gradient(135deg, #d4af37 0%, #b59024 100%);
            color: #071f18;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            padding: 8px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .notice-badge {
            display: inline-block;
            background-color: rgba(212, 175, 55, 0.2);
            color: var(--gold-main);
            border: 1px solid var(--gold-main);
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 8px;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #051611;
            border-top: 1px solid var(--border-gold);
            display: flex;
            justify-content: space-around;
            padding: 6px 0;
            z-index: 100;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: 0.2s;
            flex: 1;
        }

        .nav-item.active {
            color: var(--gold-main);
            font-weight: bold;
            background-color: rgba(212, 175, 55, 0.12);
        }

        .nav-icon {
            font-size: 19px;
        }

        .status-box {
            text-align: center;
            padding: 30px 15px;
            color: var(--text-muted);
            width: 100%;
        }

        /* আরবি লেখার ফন্ট এবং সাইজ বড় ও অ্যাডজাস্টেবল করার জন্য */
        /* আরবি লেখার ফন্ট এবং স্বাভাবিক ফাঁকা জায়গা ঠিক করার জন্য */
.article-content-body div[dir="rtl"] {
    font-family: 'Noorehuda', 'Al Qalam Quran Majeed', 'PDMS Saleem QuranFont', 'Amiri', serif !important;
    font-size: 1.55em !important;
    line-height: 1.8 !important;
    margin: -18px 0 -18px 0 !important;
    padding: 0 !important;
}
    </style>
</head>
<body>

    <header>
        <div class="app-title">দ্বীনি মেহনত</div>
        <button type="button" class="refresh-btn" onclick="manualRefresh()">🔄 আপডেট</button>
    </header>

    <main>
        <!-- ১. অডিও সেকশন -->
        <section id="tab-audio" class="tab-section active">
            <div id="audio-list" class="status-box">
                অডিও তালিকা দেখতে নিচের বাটনে চাপ দিন।<br>
                <button type="button" class="btn-gold" style="margin-top: 15px;" onclick="fetchAudiosFromArchive()">🎧 অডিও লোড করুন</button>
            </div>
        </section>

        <!-- ২. প্রবন্ধ সেকশন -->
        <section id="tab-articles" class="tab-section">
            <div class="font-control-bar">
                <span style="font-size: 13px; color: var(--gold-light);">🔍 লেখার আকার: <b id="font-size-display">16px</b></span>
                <div style="display: flex; gap: 8px;">
                    <button type="button" class="font-btn" onclick="changeArticleFontSize(-1)">A-</button>
                    <button type="button" class="font-btn" onclick="resetArticleFontSize()">ডিফল্ট</button>
                    <button type="button" class="font-btn" onclick="changeArticleFontSize(1)">A+</button>
                </div>
            </div>
            <div id="article-list" class="status-box">ডাটা লোড হচ্ছে...</div>
        </section>

        <!-- ৩. নোটিশবোর্ড সেকশন -->
        <section id="tab-notices" class="tab-section">
            <div id="notice-list" class="status-box">ডাটা লোড হচ্ছে...</div>
        </section>

        <!-- ৪. উমরি কাজা সেকশন -->
        <section id="tab-qaza" class="tab-section">
            <div class="item-card" style="border: 1px dashed var(--gold-main); background: rgba(13, 51, 39, 0.7); margin-bottom: 16px;">
                <div class="item-title" style="font-size: 16px; margin-bottom: 6px;">⚙️ ওয়াক্ত অনুযায়ী কাজা নির্ধারণ</div>
                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">
                    যে ওয়াক্ত যত দিন কাজা হয়েছে লিখে সংরক্ষণ করুন।
                </p>
                
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px;">
                    <div>
                        <label style="font-size: 12px; color: var(--gold-light);">ফজর:</label>
                        <input type="number" id="input_fajr" placeholder="০" min="0" style="width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border-gold); background: #071f18; color: #fff; outline: none;">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--gold-light);">যোহর:</label>
                        <input type="number" id="input_dhuhr" placeholder="০" min="0" style="width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border-gold); background: #071f18; color: #fff; outline: none;">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--gold-light);">আসর:</label>
                        <input type="number" id="input_asr" placeholder="০" min="0" style="width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border-gold); background: #071f18; color: #fff; outline: none;">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--gold-light);">মাগরিব:</label>
                        <input type="number" id="input_maghrib" placeholder="০" min="0" style="width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border-gold); background: #071f18; color: #fff; outline: none;">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--gold-light);">এশা:</label>
                        <input type="number" id="input_isha" placeholder="০" min="0" style="width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border-gold); background: #071f18; color: #fff; outline: none;">
                    </div>
                    <div>
                        <label style="font-size: 12px; color: var(--gold-light);">বিতর:</label>
                        <input type="number" id="input_witr" placeholder="০" min="0" style="width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px; border: 1px solid var(--border-gold); background: #071f18; color: #fff; outline: none;">
                    </div>
                </div>

                <button type="button" class="btn-gold" onclick="saveCustomQaza()" style="width: 100%; justify-content: center; padding: 10px;">
                    💾 নতুন হিসাব সংরক্ষণ করুন
                </button>
            </div>

            <div id="qaza-summary" class="item-card" style="text-align: center; border-color: var(--gold-main); padding: 10px; margin-bottom: 12px;">
                <span style="font-size: 13px; color: var(--text-muted);">সর্বমোট অবশিষ্ট কাজা: </span>
                <span id="total-qaza-count" style="font-size: 20px; font-weight: bold; color: var(--gold-main);">০</span>
                <span style="font-size: 13px; color: var(--text-muted);"> ওয়াক্ত</span>
            </div>

            <div id="qaza-grid" style="display: flex; flex-direction: column; gap: 10px;"></div>
        </section>
    </main>

    <nav>
        <button type="button" class="nav-item active" data-tab="audio" onclick="switchTab('audio', this)">
            <span class="nav-icon">🎧</span>
            <span>অডিও</span>
        </button>
        <button type="button" class="nav-item" data-tab="articles" onclick="switchTab('articles', this)">
            <span class="nav-icon">📖</span>
            <span>প্রবন্ধ</span>
        </button>
        <button type="button" class="nav-item" data-tab="notices" onclick="switchTab('notices', this)">
            <span class="nav-icon">📌</span>
            <span>নোটিশবোর্ড</span>
        </button>
        <button type="button" class="nav-item" data-tab="qaza" onclick="switchTab('qaza', this)">
            <span class="nav-icon">📿</span>
            <span>উমরি কাজা</span>
        </button>
    </nav>

    <script>
        const DATA_URL = "data.json";
        const ARCHIVE_IDENTIFIER = "20261111_202611";
        
        // পূর্বের সক্রিয় ট্যাব মনে রাখা (যাতে অফলাইনে রিলোড হলেও অডিও ট্যাবে ফিরে না যায়)
        let currentActiveTab = sessionStorage.getItem('active_app_tab') || 'audio';
        let isAudioLoaded = false;

        let currentArticleFontSize = parseInt(localStorage.getItem('user_article_font_size')) || 16;

        function updateArticleFontSizeUI() {
            const displayEl = document.getElementById('font-size-display');
            if (displayEl) displayEl.innerText = currentArticleFontSize + 'px';
            document.querySelectorAll('.article-content-body').forEach(el => {
                el.style.fontSize = currentArticleFontSize + 'px';
            });
        }

        function changeArticleFontSize(delta) {
            currentArticleFontSize += delta;
            if (currentArticleFontSize < 12) currentArticleFontSize = 12;
            if (currentArticleFontSize > 28) currentArticleFontSize = 28;
            localStorage.setItem('user_article_font_size', currentArticleFontSize);
            updateArticleFontSizeUI();
        }

        function resetArticleFontSize() {
            currentArticleFontSize = 16;
            localStorage.setItem('user_article_font_size', currentArticleFontSize);
            updateArticleFontSizeUI();
        }

        function switchTab(tabName, btnElement) {
            currentActiveTab = tabName;
            sessionStorage.setItem('active_app_tab', tabName);

            document.querySelectorAll('.tab-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));

            const targetSection = document.getElementById('tab-' + tabName);
            if (targetSection) targetSection.classList.add('active');
            
            if (btnElement) {
                btnElement.classList.add('active');
            } else {
                const savedBtn = document.querySelector(`.nav-item[data-tab="${tabName}"]`);
                if (savedBtn) savedBtn.classList.add('active');
            }

            if (tabName === 'audio' && !isAudioLoaded && navigator.onLine) {
                fetchAudiosFromArchive();
            }
        }

        function fetchWithTimeout(resource, timeout = 4000) {
            return Promise.race([
                fetch(resource),
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('Request Timeout')), timeout)
                )
            ]);
        }

        async function fetchAudiosFromArchive() {
            const container = document.getElementById('audio-list');
            if (!container) return;

            if (!navigator.onLine) {
                container.className = 'status-box';
                container.innerHTML = `
                    📡 আপনি অফলাইনে আছেন। অডিও শুনতে ইন্টারনেট সংযোগ চালু করুন।
                `;
                return;
            }

            container.className = 'status-box';
            container.innerHTML = 'অডিও লোড হচ্ছে...';

            const primaryUrl = `https://archive.org/metadata/${ARCHIVE_IDENTIFIER}/files`;
            const fallbackUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(primaryUrl)}`;

            let data = null;
            try {
                const response = await fetchWithTimeout(primaryUrl, 4000);
                if (response.ok) data = await response.json();
            } catch (err) {}

            if (!data || !data.result) {
                try {
                    const fallbackResponse = await fetchWithTimeout(fallbackUrl, 5000);
                    if (fallbackResponse.ok) data = await fallbackResponse.json();
                } catch (fallbackErr) {}
            }

            if (!data || !data.result) {
                container.className = 'status-box';
                container.innerHTML = `
                    অডিও লোড করতে সমস্যা হয়েছে।<br>
                    <button type="button" class="btn-gold" style="margin-top: 15px;" onclick="fetchAudiosFromArchive()">🔄 আবার চেষ্টা করুন</button>
                `;
                return;
            }

            const audioFiles = data.result.filter(file => 
                file.name && file.name.toLowerCase().endsWith('.opus')
            );

            if (audioFiles.length === 0) {
                container.className = 'status-box';
                container.innerHTML = 'কোনো অডিও ফাইল পাওয়া যায়নি।';
                return;
            }

            container.className = '';
            container.innerHTML = audioFiles.map(file => {
                const fileUrl = `https://archive.org/download/${ARCHIVE_IDENTIFIER}/${encodeURIComponent(file.name)}`;
                const displayTitle = file.name.replace(/\.opus$/i, '');

                return `
                    <div class="item-card">
                        <div class="item-title">🎙️ ${displayTitle}</div>
                        <div class="audio-controls">
                            <audio controls preload="none">
                                <source src="${fileUrl}" type="audio/ogg; codecs=opus">
                                <source src="${fileUrl}" type="audio/opus">
                                আপনার ডিভাইসটি এই অডিও সাপোর্ট করছে না।
                            </audio>
                            <div style="display: flex; justify-content: flex-end;">
                                <a href="${fileUrl}" download class="btn-gold">⬇️ ডাউনলোড</a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            isAudioLoaded = true;
        }

        async function fetchContent() {
            const cachedSiteData = localStorage.getItem('user_cached_site_data');
            let hasCache = false;
            if (cachedSiteData) {
                try {
                    const parsed = JSON.parse(cachedSiteData);
                    renderArticles(parsed.articles || []);
                    renderNotices(parsed.notices || []);
                    hasCache = true;
                } catch(e) {}
            }

            if (navigator.onLine) {
                try {
                    const response = await fetchWithTimeout(DATA_URL, 3500);
                    if (response.ok) {
                        const data = await response.json();
                        localStorage.setItem('user_cached_site_data', JSON.stringify(data));
                        renderArticles(data.articles || []);
                        renderNotices(data.notices || []);
                    }
                } catch (error) {
                    if (!hasCache) {
                        renderArticles([]);
                        renderNotices([]);
                    }
                }
            } else if (!hasCache) {
                renderArticles([]);
                renderNotices([]);
            }
        }

        async function renderArticles(articles) {
            const container = document.getElementById('article-list');
            if (!container) return;

            if (!articles || articles.length === 0) {
                container.className = 'status-box';
                container.innerHTML = 'কোনো প্রবন্ধ পাওয়া যায়নি।';
                return;
            }

            container.className = '';

            let html = '';
            for (const item of articles) {
                let textContent = item.content || '';

                if (item.file) {
                    const cacheKey = 'text_cache_' + item.file;
                    const savedText = localStorage.getItem(cacheKey);

                    if (savedText) textContent = savedText;

                    if (navigator.onLine) {
                        try {
                            const response = await fetchWithTimeout(item.file, 3500);
                            if (response.ok) {
                                textContent = await response.text();
                                localStorage.setItem(cacheKey, textContent);
                            }
                        } catch (err) {
                            if (!savedText) textContent = 'ফাইলটি পড়তে একবার ইন্টারনেট চালু করে লোড করে নিন।';
                        }
                    } else if (!savedText) {
                        textContent = 'ফাইলটি অফলাইনে পড়ার জন্য পূর্বে লোড করা হয়নি।';
                    }
                }

                html += `
                    <div class="item-card" style="padding: 0; overflow: hidden;">
                        <details style="cursor: pointer;">
                            <summary style="padding: 14px 16px; list-style: none; outline: none; user-select: none;">
                                <div class="item-title">📜 ${item.title || 'শিরোনামহীন'}</div>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
                                    <span class="item-date">তারিখ: ${item.date || '—'}</span>
                                    <span style="font-size: 13px; color: var(--gold-main);">পড়ুন ▼</span>
                                </div>
                            </summary>
                            <div class="article-content-body" style="white-space: pre-wrap; font-size: ${currentArticleFontSize}px; line-height: 1.8; color: var(--text-light); text-align: left; padding: 12px 16px 16px 16px; border-top: 1px dashed var(--border-gold);">${textContent}</div>
                        </details>
                    </div>
                `;
            }

            container.innerHTML = html;
            updateArticleFontSizeUI();
        }

        function renderNotices(notices) {
            const container = document.getElementById('notice-list');
            if (!container) return;

            if (!notices || notices.length === 0) {
                container.className = 'status-box';
                container.innerHTML = 'বর্তমানে কোনো নতুন নোটিশ নেই।';
                return;
            }

            container.className = '';
            container.innerHTML = notices.map(item => `
                <div class="item-card">
                    <span class="notice-badge">🔔 ${item.priority || 'সাধারণ নোটিশ'}</span>
                    <div class="item-title">${item.title}</div>
                    <span class="item-date">তারিখ: ${item.date || '—'}</span>
                    <div class="item-desc">${item.content}</div>
                </div>
            `).join('');
        }

        const WAQTS = [
            { id: 'fajr', name: 'ফজর' },
            { id: 'dhuhr', name: 'যোহর' },
            { id: 'asr', name: 'আসর' },
            { id: 'maghrib', name: 'মাগরিব' },
            { id: 'isha', name: 'এশা' },
            { id: 'witr', name: 'বিতর' }
        ];

        function loadQazaData() {
            const saved = localStorage.getItem('user_umri_qaza_data');
            if (saved) return JSON.parse(saved);
            return { fajr: 0, dhuhr: 0, asr: 0, maghrib: 0, isha: 0, witr: 0 };
        }

        function saveQazaData(data) {
            localStorage.setItem('user_umri_qaza_data', JSON.stringify(data));
            renderQazaCards();
        }

        function saveCustomQaza() {
            const currentData = loadQazaData();
            const updatedData = {};

            WAQTS.forEach(w => {
                const inputVal = document.getElementById('input_' + w.id).value.trim();
                if (inputVal !== "") {
                    const parsed = parseInt(inputVal);
                    updatedData[w.id] = (isNaN(parsed) || parsed < 0) ? 0 : parsed;
                } else {
                    updatedData[w.id] = currentData[w.id] || 0;
                }
            });

            if (confirm("নতুন কাজা সংখ্যা সংরক্ষণ করতে চান?")) {
                saveQazaData(updatedData);
                WAQTS.forEach(w => {
                    document.getElementById('input_' + w.id).value = '';
                });
                alert("হিসাব সংরক্ষিত হয়েছে!");
            }
        }

        function decrementWaqt(waqtId) {
            const data = loadQazaData();
            if (data[waqtId] > 0) {
                data[waqtId] -= 1;
                saveQazaData(data);
            } else {
                alert("আলহামদুলিল্লাহ! এই ওয়াক্তের কাজা বাকি নেই।");
            }
        }

        function incrementWaqt(waqtId) {
            const data = loadQazaData();
            data[waqtId] = (data[waqtId] || 0) + 1;
            saveQazaData(data);
        }

        function editWaqtDirectly(waqtId, waqtName) {
            const data = loadQazaData();
            const currentVal = data[waqtId] || 0;
            const newVal = prompt(`${waqtName} ওয়াক্তের বর্তমান কাজা সংখ্যা:`, currentVal);
            
            if (newVal !== null) {
                const parsed = parseInt(newVal.trim());
                if (!isNaN(parsed) && parsed >= 0) {
                    data[waqtId] = parsed;
                    saveQazaData(data);
                } else {
                    alert("সঠিক সংখ্যা লিখুন!");
                }
            }
        }

        function renderQazaCards() {
            const container = document.getElementById('qaza-grid');
            const totalEl = document.getElementById('total-qaza-count');
            if (!container) return;

            const data = loadQazaData();
            let totalCount = 0;

            container.innerHTML = WAQTS.map(w => {
                const count = data[w.id] || 0;
                totalCount += count;
                
                return `
                    <div class="item-card" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; margin-bottom: 0;">
                        <div>
                            <div style="font-size: 16px; font-weight: bold; color: var(--gold-light); display: flex; align-items: center; gap: 8px;">
                                <span>${w.name}</span>
                                <button type="button" onclick="editWaqtDirectly('${w.id}', '${w.name}')" title="এডিট করুন" style="background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px;">✏️</button>
                            </div>
                            <div style="font-size: 12px; color: var(--text-muted); margin-top: 3px;">
                                বাকি: <span style="font-size: 15px; font-weight: bold; color: ${count === 0 ? '#10b981' : 'var(--gold-main)'};">${count}</span> ওয়াক্ত
                            </div>
                        </div>
                        
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button type="button" onclick="incrementWaqt('${w.id}')" style="background: transparent; border: 1px solid var(--border-gold); color: var(--text-light); width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 16px;">+</button>
                            <button type="button" class="btn-gold" onclick="decrementWaqt('${w.id}')" style="padding: 6px 12px; font-size: 12px;">✔ আদায় (-১)</button>
                        </div>
                    </div>
                `;
            }).join('');

            if (totalEl) totalEl.innerText = totalCount;
        }

        function manualRefresh() {
            fetchContent();
            if (currentActiveTab === 'audio' && navigator.onLine) {
                isAudioLoaded = false;
                fetchAudiosFromArchive();
            }
        }

        // পেজ লোড হওয়ার পর পূর্বের নির্বাচিত ট্যাবটি পুনরুদ্ধার করা
        switchTab(currentActiveTab);
        fetchContent();
        renderQazaCards();

        // অফলাইনে সার্ভিস ওয়ার্কারের কারণে যেন পেজ রিলোড না হয় তার গার্ড
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                if (navigator.onLine) {
                    navigator.serviceWorker.register('./sw.js').catch(() => {});
                }
            });
        }
    </script>
</body>
</html>
